default:
  tags: [linux]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: '0'

stages:
  - build
  - publish

before_script:
  - export VERSION=`greycat build-version`

build:
  stage: build
  script:
    - echo "VERSION=$VERSION"
    - ./scripts/codegen.sh
    - ./scripts/build.sh
    - ./scripts/test.sh
    - echo "VERSION=$VERSION"

publish:
  stage: publish
  tags: [linux]
  rules:
    # always publish automatically on the dev branch
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
    # any other branch: manual, branch pipelines only. The `if: $CI_COMMIT_BRANCH` guard is
    # required — a bare `when: manual` also matches merge_request_event, which spawns a
    # duplicate detached MR pipeline on every push to a branch that has an open MR.
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - echo "VERSION=$VERSION"
    - ./scripts/codegen.sh
    - ./scripts/build.sh
    - ./scripts/pack.sh
    - ./scripts/publish.sh
    - echo "VERSION=$VERSION"
