variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  DEPS_ROOT: "/opt/pro_deps"

stages:
  - build
  - pack
  - publish

# Publishing runs itself on `dev` once the build stage is green, and stays a
# manual click on every other branch. Each publish adds a version to the branch,
# which becomes what `greycat install --bump` resolves for everyone tracking it.
#
# A version is immutable and holds every target, so a native library packs each
# target in its own job and one `publish` job sends all the archives together.

before_script:
  - export PROJECT_VERSION_MAJOR_MINOR=`cat VERSION`
  - export PROJECT_VERSION=`greycat build-version`
  - mkdir -p ${CI_PROJECT_DIR}/build
  - mkdir -p $DEPS_ROOT

# Reuse the prebuilt greycat-dev image. The image reference is read from the
# "image" field of .devcontainer/devcontainer.json and pulled only
# when it is not already present locally; otherwise the locally cached image
# is reused.
#
# `greycat install` in the container needs GREYCAT_REGISTRY_TOKEN (a group
# variable) to download libraries that are not anonymously readable. `-e NAME`
# without a value forwards it from the job, so the token never shows in the
# echoed command.
.docker_build:
  script: &docker_build_script
    - export GREYCAT_DEV_IMAGE=$(grep -o '"image"[[:space:]]*:[[:space:]]*"[^"]*"' ${CI_PROJECT_DIR}/.devcontainer/devcontainer.json | sed -E 's/.*"image"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
    - docker image inspect "${GREYCAT_DEV_IMAGE}" >/dev/null 2>&1 || docker pull "${GREYCAT_DEV_IMAGE}"

# The jobs that run on the runner itself, not in the devcontainer image, use the
# greycat their project pins, installed in the job's own GREYCAT_HOME.
.host_greycat:
  script: &host_greycat
    - export GREYCAT_HOME="${CI_PROJECT_DIR}/.greycat"
    - export PATH="${GREYCAT_HOME}/bin:${PATH}"
    - ./script/host_greycat.sh

x64-linux:
  stage: build
  rules: [{ exists: [CMakeLists.txt] }]
  tags: [linux]
  script:
    - *docker_build_script
    - export GREYCAT_TARGET="x64-linux"
    - export CFLAGS="-march=x86-64-v3 -O3"
    - docker run --rm -v "${DEPS_ROOT}:${DEPS_ROOT}:z" -v "${CI_PROJECT_DIR}:/project:z" -e CI="true" -e CI_JOB_TOKEN="${CI_JOB_TOKEN}" -e GREYCAT_REGISTRY_TOKEN -e DEPS_ROOT="${DEPS_ROOT}" -e PROJECT_VERSION="${PROJECT_VERSION}" -e CFLAGS="${CFLAGS}" -e GREYCAT_TARGET=${GREYCAT_TARGET} "${GREYCAT_DEV_IMAGE}" /project/script/build.sh
    - ./script/test.sh

arm64-linux:
  stage: build
  rules: [{ exists: [CMakeLists.txt] }]
  tags: [linux_arm64]
  variables:
    GREYCAT_TARGET: arm64-linux
    CFLAGS: -march=armv8-a+crypto
    OPENSSL_TARGET: linux-aarch64
  script:
    - *docker_build_script
    - docker run --rm -v "${DEPS_ROOT}:${DEPS_ROOT}:z" -v "${CI_PROJECT_DIR}:/project:z" -e CI="true" -e CI_JOB_TOKEN="${CI_JOB_TOKEN}" -e GREYCAT_REGISTRY_TOKEN -e DEPS_ROOT="${DEPS_ROOT}" -e PROJECT_VERSION="${PROJECT_VERSION}" -e CFLAGS="${CFLAGS}" -e GREYCAT_TARGET=${GREYCAT_TARGET} "${GREYCAT_DEV_IMAGE}" /project/script/build.sh
    #- ./script/test.sh

arm64-apple:
  stage: build
  rules: [{ exists: [CMakeLists.txt] }]
  tags: [macos_native]
  variables:
    GREYCAT_TARGET: arm64-apple
    CFLAGS: "-target arm64-apple-macos15.4 -DHAVE_STRCHRNUL -mmacosx-version-min=15.4"
    OPENSSL_TARGET: darwin64-arm64-cc
  script:
    - *host_greycat
    - ./script/build.sh
    - ./script/test.sh

x64-windows:
  stage: build
  rules: [{ exists: [CMakeLists.txt] }]
  tags: [mingw]
  variables:
    CROSS: true
    GREYCAT_TARGET: x64-windows
    OPENSSL_TARGET: mingw64
  script:
    - *docker_build_script
    - docker run --rm -v "${DEPS_ROOT}:${DEPS_ROOT}:z" -v "${CI_PROJECT_DIR}:/project:z" -e CI="true" -e CI_JOB_TOKEN="${CI_JOB_TOKEN}" -e GREYCAT_REGISTRY_TOKEN -e CROSS="${CROSS}" -e DEPS_ROOT="${DEPS_ROOT}" -e PROJECT_VERSION="${PROJECT_VERSION}" -e CFLAGS="${CFLAGS}" -e GREYCAT_TARGET=${GREYCAT_TARGET} "${GREYCAT_DEV_IMAGE}" /project/script/build_win.sh

x64-linux-pack:
  stage: pack
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: [CMakeLists.txt]
      when: on_success
    - exists: [CMakeLists.txt]
      when: manual
  tags: [linux]
  variables:
    GREYCAT_TARGET: x64-linux
    CFLAGS: "-march=x86-64-v3"
  script:
    - *docker_build_script
    - docker run --rm -v "${DEPS_ROOT}:${DEPS_ROOT}:z" -v "${CI_PROJECT_DIR}:/project:z" -e CI="true" -e CI_JOB_TOKEN="${CI_JOB_TOKEN}" -e GREYCAT_REGISTRY_TOKEN -e DEPS_ROOT="${DEPS_ROOT}" -e PROJECT_VERSION="${PROJECT_VERSION}" -e CFLAGS="${CFLAGS}" -e GREYCAT_TARGET=${GREYCAT_TARGET} "${GREYCAT_DEV_IMAGE}" /project/script/build.sh
    - ./script/pack.sh
  artifacts:
    paths: [dist]
    expire_in: 1 day

arm64-linux-pack:
  stage: pack
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: [CMakeLists.txt]
      when: on_success
    - exists: [CMakeLists.txt]
      when: manual
  tags: [linux_arm64]
  variables:
    GREYCAT_TARGET: arm64-linux
    CFLAGS: -march=armv8-a+crypto
    OPENSSL_TARGET: linux-aarch64
  script:
    - *docker_build_script
    - docker run --rm -v "${DEPS_ROOT}:${DEPS_ROOT}:z" -v "${CI_PROJECT_DIR}:/project:z" -e CI="true" -e CI_JOB_TOKEN="${CI_JOB_TOKEN}" -e GREYCAT_REGISTRY_TOKEN -e DEPS_ROOT="${DEPS_ROOT}" -e PROJECT_VERSION="${PROJECT_VERSION}" -e CFLAGS="${CFLAGS}" -e GREYCAT_TARGET=${GREYCAT_TARGET} "${GREYCAT_DEV_IMAGE}" /project/script/build.sh
    - ./script/pack.sh
  artifacts:
    paths: [dist]
    expire_in: 1 day

arm64-apple-pack:
  stage: pack
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: [CMakeLists.txt]
      when: on_success
    - exists: [CMakeLists.txt]
      when: manual
  tags: [macos_native]
  variables:
    GREYCAT_TARGET: arm64-apple
    CFLAGS: "--target=arm64-apple-macos11"
    OPENSSL_TARGET: darwin64-arm64-cc
  script:
    - *host_greycat
    - ./script/build.sh
    - ./script/pack.sh
  artifacts:
    paths: [dist]
    expire_in: 1 day

x64-windows-pack:
  stage: pack
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: [CMakeLists.txt]
      when: on_success
    - exists: [CMakeLists.txt]
      when: manual
  tags: [mingw]
  variables:
    CROSS: true
    GREYCAT_TARGET: x64-windows
    OPENSSL_TARGET: mingw64
    CMAKE_TOOLCHAIN_FILE: /opt/x86_64-w64-mingw32ucrt.cmake
  script:
    - *docker_build_script
    - docker run --rm -v "${DEPS_ROOT}:${DEPS_ROOT}:z" -v "${CI_PROJECT_DIR}:/project:z" -e CI="true" -e CI_JOB_TOKEN="${CI_JOB_TOKEN}" -e GREYCAT_REGISTRY_TOKEN -e CROSS="${CROSS}" -e DEPS_ROOT="${DEPS_ROOT}" -e PROJECT_VERSION="${PROJECT_VERSION}" -e CFLAGS="${CFLAGS}" -e GREYCAT_TARGET=${GREYCAT_TARGET} "${GREYCAT_DEV_IMAGE}" /project/script/build_win.sh
    - ./script/pack.sh
  artifacts:
    paths: [dist]
    expire_in: 1 day

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: [CMakeLists.txt]
      when: on_success
    - exists: [CMakeLists.txt]
      when: manual
  tags: [linux]
  needs: [x64-linux-pack, arm64-linux-pack, arm64-apple-pack, x64-windows-pack]
  script:
    - ./script/publish.sh

# A pure-GCL library carries no CMakeLists.txt. There is nothing to
# cross-compile, and its artifact is identical on every target, so it builds
# once and pack.sh publishes it under `noarch`. `greycat install` asks for
# <target>/<version>.zip and retries the same path under noarch when that 404s,
# so the single upload serves all four.
noarch:
  stage: build
  tags: [linux]
  rules:
    - exists: [CMakeLists.txt]
      when: never
    - when: on_success
  script:
    - *host_greycat
    - ./script/build.sh
    - ./script/test.sh

noarch-publish:
  stage: publish
  tags: [linux]
  rules:
    - exists: [CMakeLists.txt]
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success
    - when: manual
  script:
    - *host_greycat
    - ./script/build.sh
    - ./script/pack.sh
    - ./script/publish.sh
