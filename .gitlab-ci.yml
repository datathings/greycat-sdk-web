default:
  tags: [linux]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"

stages:
  - build
  - publish

before_script:
  - export VERSION=`git2version -s`

build:
  stage: build
  script:
    - ./scripts/codegen.sh
    - ./scripts/build.sh
    - ./scripts/test.sh

publish:
  stage: publish
  when: manual
  script:
    - ./scripts/codegen.sh
    - ./scripts/build.sh
    - ./scripts/pack.sh
    - ./scripts/publish.sh

